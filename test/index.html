<!DOCTYPE html>
<html>

	<head>
		<title>leaflet-rotate.js</title>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
		<meta name="viewport" content="initial-scale=1.0, user-scalable=no" />

		<link id="leaflet-css" rel="stylesheet">

		<!-- include some miscellaneous -->
		<script src="../misc/route.js"></script>
		<script src="../misc/places.js"></script>
		<script src="../misc/loremIpsum.js"></script>

		<style>
			#map {
				width: 100%;
				height: 600px;
				border: 1px solid #ccc;
				max-height: 50vh;
			}
			/* TODO: fix incorrect map corners position when map has some margin */
			html, body {
				/* margin: 0; */
				/* padding: 0; */
			}
		</style>
	</head>

	<body>

		<label for="leaflet-version">Leaflet version:</label>
		<select id="leaflet-version">
			<option value="1">1.9.4</option>
			<option value="2">2.0.0-alpha.1</option>
		</select>

		<div id="map"></div>

		<hr>

		<div>
			<p>
				<strong>Fly to bounds: </strong>
				<button onclick="map.flyToBounds(circle.getBounds());">CIRCLE</button>
				<button onclick="map.flyToBounds(polygon.getBounds());"> POLYGON</button>
				<button onclick="map.flyToBounds(path.getBounds());">PATH</button>
			</p>
			<p>
				<strong>Fly to: </strong>
				<button onclick="map.flyTo(places['Kyiv'], 10);">Kyiv</button>
				<button onclick="map.flyTo(places['London'], 10);">London</button>
				<button onclick="map.flyTo(places['San Francisco'], 10);">San Francisco</button>
				<button onclick="map.flyTo(places['Washington'], 10);">Washington</button>
				<button onclick="map.flyTo(places['Trondheim'], 10);">Trondheim</button>
			</p>
			<p>
				<strong>Fit bounds (z = 0): </strong>
				<button onclick="map.setZoom(0, {animate: false}) && setTimeout(() => map.fitBounds(rectangle.getBounds(), { animate: false }), 1000);" title="DEBUG: map.setZoom(0) && map.getBoundsZoom(rectangle.getBounds())">RECTANGLE</button>
			</p>
		</div>

		<script type="module">
			const versionSelect = document.getElementById('leaflet-version');
			const params = new URLSearchParams(location.search);
			versionSelect.value = params.get('leaflet') === '2' ? '2' : '1';
			versionSelect.addEventListener('change', () => {
				location.search = `?leaflet=${versionSelect.value}`;
			});

			const loadScript = src => new Promise((resolve, reject) => {
				const script = document.createElement('script');
				script.src = src;
				script.onload = resolve;
				script.onerror = () => reject(new Error(`Could not load ${src}`));
				document.head.appendChild(script);
			});

			const version = versionSelect.value;
			document.getElementById('leaflet-css').href = version === '2'
				? 'https://unpkg.com/leaflet@2.0.0-alpha.1/dist/leaflet.css'
				: 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';

			if (version === '2') {
				globalThis.L = await import('https://unpkg.com/leaflet@2.0.0-alpha.1/dist/leaflet.js');
			} else {
				await loadScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.js');
			}
			await loadScript('../dist/leaflet-rotate-src.js');
			await loadScript('../lib/debug.js');
			const L = globalThis.L;

			const esri = new L.TileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
				id: 'mapbox.streets',
				maxZoom: 24,
				maxNativeZoom: 18,
				attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
				// noWrap: true
			});

			const osm = new L.TileLayer('http://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
				maxZoom: 24,
				maxNativeZoom: 19,
				attribution: '&copy; <a href="http://openstreetmap.org/copyright">OpenStreetMap</a> contributors',
				// noWrap: true
			});

			const map = new L.Map('map', {
				center: [55, 10],
				zoom: 2,
				layers: [esri],
				// worldCopyJump: true,
				// preferCanvas: false,
				zoomAnimation: false, /* DEBUG: L.Renderer._updateTransform() */
				rotate: true,
				rotateControl: {
					closeOnZeroBearing: false,
					// position: 'bottomleft',
				},
				bearing: 30,
				// attributionControl: false,
				// zoomControl: false,
				compassBearing: true,
				// trackContainerMutation: false,
				// shiftKeyRotate: false,
				// touchGestures: true,
				touchRotate: true,
				// touchZoom: true
			});
			window.map = map;
			window.esri = esri;
			window.osm = osm;

			// map.setBearing(90);
			// map.touchRotate.enable();

			// map.touchZoom.disable()
			// map.compassBearing.disable()
			// map.touchGestures.enable()

			// map.zoomControl.setPosition('bottomleft');
			// map.rotateControl.setPosition('bottomleft');
			// map.setMaxBounds([[-90,-180], [90,180]]);

			const layers = new L.Control.Layers({
				'Empty': new L.TileLayer(''),
				'Streets': osm,
				'Satellite': esri,
			}, null, {
				collapsed: false
			}).addTo(map);
			window.layers = layers;

			const markers = [];
			for (const i in places) {
				markers.push(new L.Marker(places[i], {
						draggable: true
					})
					.bindPopup('<b>' + i + '</b><br>' + loremIpsum)
					.bindTooltip('<b>' + i + '</b>',
						markers.length ? {} : {
							direction: 'right',
							permanent: true
						}
					)
					.addTo(map));
			}
			window.markers = markers;

			const path = new L.Polyline(route, {
				renderer: new L.Canvas()
			}).addTo(map);
			window.path = path;

			const circle = new L.Circle([53, 4], 111111)
				.addTo(map);
			window.circle = circle;

			const polygon = new L.Polygon([
				[48, -3],
				[50, -4],
				[52, 4]
			]).addTo(map);
			window.polygon = polygon;

			const rectangle = new L.Rectangle([
				[60.81123, 25.71632],
				[60.81028, 25.73166],
				[60.7997, 25.72892],
				[60.80061, 25.71362]
			]).addTo(map);
			window.rectangle = rectangle;

			// Display some debug info
			L.Rotate.debug(map);
		</script>

		<a href="https://github.com/Raruto/leaflet-rotate" class="view-on-github" style="position: fixed;bottom: 10px;left: calc(50% - 60px);z-index: 9999;"> <img alt="View on Github" src="https://raruto.github.io/img/view-on-github.png" title="View on Github"
			  width="163"> </a>

	</body>

</html>
