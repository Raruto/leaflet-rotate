<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Eiffel Tower 3D - leaflet-rotate.js</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9/dist/leaflet.css">
		<script type="importmap">
			{
				"imports": {
					"leaflet": "https://unpkg.com/leaflet@1.9/dist/leaflet-src.js",
					"leaflet-rotate": "../dist/leaflet-rotate-src.js",
					"three": "https://unpkg.com/three@0.170.0/build/three.module.js",
					"three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
				}
			}
		</script>
		<style>
			html, body, #map {
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 0;
			}
			.leaflet-eiffel-tower {
				position: absolute;
				top: 0;
				left: 0;
				z-index: 450;
				pointer-events: none;
			}
			#eiffel-message, #buildings-message {
				position: absolute;
				bottom: 30px;
				left: 10px;
				right: 10px;
				z-index: 1000;
				width: fit-content;
				padding: 8px;
				background: white;
				border-radius: 4px;
				font: 14px sans-serif;
			}
			#eiffel-message {
				bottom: 90px;
			}
		</style>
	</head>
	<body>
		<div id="map" aria-label="Map of the Eiffel Tower"></div>
		<div id="eiffel-message">
			<span id="eiffel-status" role="status">Loading Eiffel Tower 3D...</span>
			<button id="eiffel-retry" type="button" hidden>Retry</button>
		</div>
		<div id="buildings-message">
			<span id="buildings-status" role="status">Loading Paris building volumes...</span>
			<button id="buildings-retry" type="button" hidden>Retry</button>
			<br>Estimated heights: 3 metres per storey, not surveyed heights.
		</div>
		<script type="module">
			await import('leaflet');
			globalThis.L = globalThis.leaflet || globalThis.L;
			await import('leaflet-rotate');

			const esri = new L.TileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
				maxZoom: 24,
				maxNativeZoom: 18,
				attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
			});
			const osm = new L.TileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
				maxZoom: 24,
				maxNativeZoom: 19,
				attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> contributors'
			});
			const eiffelLocation = [48.8582601, 2.29449985];
			const map = new L.Map('map', {
				center: eiffelLocation,
				zoom: 17,
				layers: [esri],
				preferCanvas: true,
				rotate: true,
				rotateControl: { closeOnZeroBearing: false },
				bearing: 30,
				pitch: 45,
				touchRotate: true,
				touchPitch: true
			});
			const layers = new L.Control.Layers({
				'Empty': new L.TileLayer(''),
				'Streets': osm,
				'Satellite': esri
			}, null, { collapsed: false }).addTo(map);
			map.attributionControl.addAttribution('<a href="https://3dmr.eu/model/4">CC0 model: n42k / Blend Swap</a>');
			let eiffelTower;
			let eiffelLoading = false;

			async function loadEiffelTower() {
				if (eiffelLoading || eiffelTower) return;
				eiffelLoading = true;
				const status = document.getElementById('eiffel-status');
				const retry = document.getElementById('eiffel-retry');
				retry.hidden = true;
				status.textContent = 'Loading Eiffel Tower 3D...';
				try {
					const THREE = await import('three');
					const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
					const { mergeGeometries } = await import('three/addons/utils/BufferGeometryUtils.js');
					const EiffelTower = L.Layer.extend({
						initialize(location, model) {
							this.location = new L.LatLng(location[0], location[1]);
							this.model = model;
							this.root = new THREE.Group();
							this.root.add(model);
						},

						onAdd(map) {
							this.scene = new THREE.Scene();
							this.scene.add(this.root, new THREE.HemisphereLight(0xffffff, 0x746952, 2));
							const sunlight = new THREE.DirectionalLight(0xffefd5, 3);
							sunlight.position.set(-300, 500, 300);
							this.scene.add(sunlight);
							this.camera = new THREE.PerspectiveCamera();
							this.renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
							this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
							this.renderer.setClearColor(0x000000, 0);
							this._size = null;
							const canvas = this.renderer.domElement;
							canvas.className = 'leaflet-eiffel-tower';
							canvas.setAttribute('role', 'img');
							canvas.setAttribute('aria-label', '3D model of the Eiffel Tower in Paris');
							map.getContainer().append(canvas);
							map.on('move zoom rotate pitch resize viewreset layeradd layerremove', this._update, this);
							map.on('zoomstart', this._startZoom, this);
							map.on('zoomanim', this._animateZoom, this);
							map.on('zoomend', this._endZoom, this);
							this._render();
						},

						onRemove(map) {
							map.off('move zoom rotate pitch resize viewreset layeradd layerremove', this._update, this);
							map.off('zoomstart', this._startZoom, this);
							map.off('zoomanim', this._animateZoom, this);
							map.off('zoomend', this._endZoom, this);
							cancelAnimationFrame(this._frame);
							this._frame = null;
							this._zoomLevel = null;
							this.renderer.domElement.remove();
							this.renderer.dispose();
						},

						_update() {
							if (this._map._animatingZoom) {
								this._animateZoom();
								return;
							}
							cancelAnimationFrame(this._frame);
							this._render();
						},

						_animateZoom() {
							if (!this._frame) {
								this._frame = requestAnimationFrame(() => this._render());
							}
						},

						_getTileLevel() {
							let level;
							this._map.eachLayer(layer => {
								if (!level && layer instanceof L.TileLayer && layer._url && layer._levels) {
									level = layer._levels[layer._tileZoom];
								}
							});
							return level;
						},

						_startZoom() {
							this._zoomLevel = this._getTileLevel();
						},

						_endZoom() {
							this._zoomLevel = null;
							this._update();
						},

						_render() {
							this._frame = null;
							const map = this._map;
							const size = map.getSize();
							if (!size.x || !size.y) return;
							if (!this._size || !this._size.equals(size)) {
								this.renderer.setSize(size.x, size.y);
								this._size = size;
							}

							// Match the map's CSS camera: a perspective distance of 1.5 viewport heights.
							let pixelsPerMeter = map.options.crs.scale(map.getZoom()) /
								(40075016.68557849 * Math.cos(this.location.lat * Math.PI / 180));
							let origin = map.project(this.location).subtract(map.getPixelOrigin());
							const level = this._zoomLevel?.el.isConnected ? this._zoomLevel : this._getTileLevel();
							if (level) {
								if (map._animatingZoom) this._zoomLevel = level;
								// Leaflet's logical zoom jumps before its tile CSS transition finishes.
								// Use the rendered tile transform, including its rounding, on every animation frame.
								const transform = new DOMMatrix(map._animatingZoom
									? getComputedStyle(level.el).transform : level.el.style.transform);
								const point = map.project(this.location, level.zoom).subtract(level.origin);
								origin = new L.Point(point.x * transform.a + transform.e, point.y * transform.d + transform.f);
								pixelsPerMeter *= map.getZoomScale(level.zoom, map.getZoom()) * transform.a;
							}
							const distance = size.y * 1.5 / pixelsPerMeter;
							const center = map.containerPointToLayerPoint(size.divideBy(2));
							const target = new THREE.Vector3(
								(center.x - origin.x) / pixelsPerMeter, 0,
								(center.y - origin.y) / pixelsPerMeter
							);
							const pitch = map.getPitch() * Math.PI / 180;
							const bearing = map.getBearing() * Math.PI / 180;
							this.camera.fov = 2 * Math.atan(1 / 3) * 180 / Math.PI;
							this.camera.aspect = size.x / size.y;
							this.camera.near = Math.max(0.1, distance / 10000);
							this.camera.far = Math.max(10000, distance * 10);
							this.camera.position.set(
								target.x + Math.sin(bearing) * Math.sin(pitch) * distance,
								Math.cos(pitch) * distance,
								target.z + Math.cos(bearing) * Math.sin(pitch) * distance
							);
							this.camera.up.set(
								-Math.sin(bearing) * Math.cos(pitch),
								Math.sin(pitch),
								-Math.cos(bearing) * Math.cos(pitch)
							);
							this.camera.lookAt(target);
							this.camera.updateProjectionMatrix();
							this.renderer.render(this.scene, this.camera);
							if (map._animatingZoom) {
								this._frame = requestAnimationFrame(() => this._render());
							}
						}
					});
					// OSM way 5013364 links to 3dmr=4; revision 3 is a CC0, metre-scale GLB.
					const gltf = await new GLTFLoader().loadAsync(new URL('../misc/eiffel-tower.glb', import.meta.url).href);
					// Register the four ground corners to OSM pillars 69034127/135/179/180.
					// The GLB is axis-aligned, not north-aligned; its horizontal footprint is slightly undersized.
					gltf.scene.rotation.y = 45.81 * Math.PI / 180;
					gltf.scene.scale.set(1.0257, 1, 1.0167);
					eiffelTower = new EiffelTower(eiffelLocation, gltf.scene).addTo(map);
					const towerOverlay = new (L.Layer.extend({
						onAdd() {
							eiffelTower.root.add(gltf.scene);
							eiffelTower._update();
						},
						onRemove() {
							eiffelTower.root.remove(gltf.scene);
							eiffelTower._update();
						}
					}))().addTo(map);
					layers.addOverlay(towerOverlay, 'Eiffel Tower (3D)');

					const ParisBuildings = L.Layer.extend({
						initialize() {
							this.group = new THREE.Group();
							this.material = new THREE.MeshLambertMaterial({ color: 0xd8c5a0 });
						},

						onAdd(map) {
							eiffelTower.root.add(this.group);
							map.on('movestart', this._cancel, this);
							map.on('moveend resize rotate pitch', this._scheduleLoad, this);
							this._load();
						},

						onRemove(map) {
							map.off('movestart', this._cancel, this);
							map.off('moveend resize rotate pitch', this._scheduleLoad, this);
							this._cancel();
							this._clear();
							eiffelTower.root.remove(this.group);
							this.material.dispose();
							this._status('Paris building volumes disabled.');
							eiffelTower._update();
						},

						_status(message, failed = false) {
							document.getElementById('buildings-status').textContent = message;
							document.getElementById('buildings-retry').hidden = !failed;
						},

						_cancel() {
							clearTimeout(this._timer);
							this._request?.abort();
							this._request = null;
						},

						_scheduleLoad() {
							this._cancel();
							this._timer = setTimeout(() => this._load(), 250);
						},

						_clear() {
							for (const mesh of [...this.group.children]) {
								this.group.remove(mesh);
								mesh.geometry.dispose();
							}
						},

						async _load() {
							this._cancel();
							const map = this._map;
							if (!map) return;
							// if (map.getZoom() < 16) {
							// 	this._clear();
							// 	this._status('Zoom in to level 16 or higher to load Paris buildings.');
							// 	eiffelTower._update();
							// 	return;
							// }
							const bounds = map.getBounds();
							const west = Math.max(bounds.getWest(), 2.2424);
							const east = Math.min(bounds.getEast(), 2.416);
							const south = Math.max(bounds.getSouth(), 48.8162);
							const north = Math.min(bounds.getNorth(), 48.9022);
							if (west >= east || south >= north) {
								this._clear();
								this._status('No building volumes outside Paris.');
								eiffelTower._update();
								return;
							}
							const request = this._request = new AbortController();
							this._status('Loading Paris building volumes...');
							const [min, max] = map._getPitchedContainerBounds(0);
							const corners = [[min.x, min.y], [max.x, min.y], [max.x, max.y], [min.x, max.y]];
							const footprint = [...corners, corners[0]].map(point => {
								const latlng = map.containerPointToLatLng(new L.Point(...point));
								return `${latlng.lng} ${latlng.lat}`;
							}).join(',');
							const url = new URL('https://opendata.paris.fr/api/explore/v2.1/catalog/datasets/volumesbatisparis/exports/geojson');
							url.search = new URLSearchParams({
								select: 'geom,h_et_max,nb_pl,b_rdc,objectid',
								// limit: '5001',
								where: `intersects(geom,geom'POLYGON((${footprint}))')`
							});
							try {
								const response = await fetch(url, { signal: request.signal });
								if (!response.ok) throw new Error(`Paris Open Data returned HTTP ${response.status}`);
								const data = await response.json();
								if (request !== this._request || !this._map) return;
								if (data.type !== 'FeatureCollection' || !Array.isArray(data.features)) {
									throw new Error('Invalid building GeoJSON response');
								}
								this._clear();
								// if (data.features.length > 5000) {
								// 	this._status('More than 5,000 volumes in view. Zoom in to load buildings.');
								// 	eiffelTower._update();
								// 	return;
								// }
								this._setFeatures(data.features);
							} catch (error) {
								if (request.signal.aborted) return;
								console.error('Unable to load Paris building volumes:', error);
								this._clear();
								this._status('Unable to load Paris buildings: ' + error.message, true);
								eiffelTower._update();
							} finally {
								if (request === this._request) this._request = null;
							}
						},

						_setFeatures(features) {
							const geometries = [];
							let skipped = 0;
							const crs = map.options.crs;
							const origin = crs.project(eiffelTower.location);
							const metres = Math.cos(eiffelTower.location.lat * Math.PI / 180);
							try {
								for (const feature of features) {
									const { h_et_max: storeys, nb_pl: floors, b_rdc: ground } = feature.properties;
									// ponytail: storeys are not metres; use 3 m/storey until surveyed heights are available.
									if (!Number.isFinite(storeys) || storeys < 0 || ![0, 1].includes(ground) ||
										(ground === 0 && (!Number.isFinite(floors) || floors <= 0 || floors > storeys + 1))) {
										skipped++;
										continue;
									}
									const top = (storeys + 1) * 3;
									const bottom = ground === 0 ? Math.max(0, top - floors * 3) : 0;
									const geometry = feature.geometry;
									const polygons = geometry?.type === 'Polygon' ? [geometry.coordinates]
										: geometry?.type === 'MultiPolygon' ? geometry.coordinates : null;
									if (!polygons) throw new Error('Unsupported building geometry');
									for (const rings of polygons) {
										if (!rings.length) throw new Error('Empty building polygon');
										const paths = rings.map(ring => {
											if (ring.length < 4) throw new Error('Invalid building polygon ring');
											return ring.map(([lon, lat]) => {
												if (!Number.isFinite(lon) || !Number.isFinite(lat)) {
													throw new Error('Invalid building coordinates');
												}
												const point = crs.project(new L.LatLng(lat, lon));
												return new THREE.Vector2((point.x - origin.x) * metres, (point.y - origin.y) * metres);
											});
										});
										const shape = new THREE.Shape(paths[0]);
										shape.holes = paths.slice(1).map(points => new THREE.Path(points));
										const mesh = new THREE.ExtrudeGeometry(shape, { depth: top - bottom, bevelEnabled: false, steps: 1 });
										mesh.rotateX(-Math.PI / 2);
										mesh.translate(0, bottom, 0);
										geometries.push(mesh);
									}
								}
								if (geometries.length) {
									const merged = mergeGeometries(geometries);
									if (!merged) throw new Error('Unable to merge building geometries');
									this.group.add(new THREE.Mesh(merged, this.material));
								}
								if (skipped) console.warn(`Skipped ${skipped} Paris volumes with missing or invalid storey data.`);
								this._status(`${features.length - skipped} Paris building volumes loaded.${skipped ? ` ${skipped} skipped: missing storey data.` : ''}`);
								eiffelTower._update();
							} finally {
								for (const geometry of geometries) geometry.dispose();
							}
						}
					});
					const buildings = new ParisBuildings().addTo(map);
					layers.addOverlay(buildings, 'Paris building volumes (3D)');
					document.getElementById('buildings-retry').onclick = () => buildings._load();
					map.attributionControl.addAttribution('<a href="https://opendata.paris.fr/explore/dataset/volumesbatisparis/">Building volumes: Ville de Paris</a> (<a href="https://opendatacommons.org/licenses/odbl/">ODbL</a>)');
					status.textContent = 'Eiffel Tower 3D ready.';
					document.getElementById('eiffel-message').hidden = true;
				} catch (error) {
					console.error('Unable to load the Eiffel Tower 3D model:', error);
					status.textContent = 'Unable to load Eiffel Tower 3D: ' + error.message;
					retry.hidden = false;
				} finally {
					eiffelLoading = false;
				}
			}
			document.getElementById('eiffel-retry').addEventListener('click', loadEiffelTower);
			loadEiffelTower();
		</script>
	</body>
</html>
