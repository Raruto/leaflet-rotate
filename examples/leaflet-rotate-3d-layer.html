<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Eiffel Tower 3D - leaflet-rotate.js</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9/dist/leaflet.css">
		<script src="https://unpkg.com/leaflet@1.9/dist/leaflet-src.js"></script>
		<script src="../dist/leaflet-rotate-src.js"></script>
		<script src="../misc/3DLayer.js"></script>
		<script src="../misc/PMTilesLayer.js"></script>
		<style>
			html, body, #map {
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 0;
			}
		</style>
	</head>
	<body>
		<div id="map"></div>
		<script>
			const map = new L.Map('map', {
				center: [48.8582601, 2.29449985],
				zoom: 17,
				minZoom: 14,
				preferCanvas: true,
				rotate: true,
				rotateControl: { closeOnZeroBearing: false },
				bearing: 30,
				pitch: 45,
				touchRotate: true,
				touchPitch: true
			});
			const layers = new L.Control.Layers({
				'Empty': new L.TileLayer(''),
				// Offline archive built by `node build/pmtiles.js`.
				'Plan IGN': new L.PMTilesLayer('data/paris-plan-ign.pmtiles', {
					maxZoom: 24,
					attribution: '<a href="https://cartes.gouv.fr/rechercher-une-donnee/dataset/IGNF_PLAN-IGN">Plan IGN</a> &copy; IGN &mdash; <a href="https://ia.numerique.gouv.fr/licence-ouverte-open-licence/">Licence Ouverte Etalab 2.0</a>'
				}),
				// Offline archive built by `node build/pmtiles.js`.
				'Orthophoto IGN': new L.PMTilesLayer('data/paris-orthophotos.pmtiles', {
					maxZoom: 24,
					attribution: '<a href="https://cartes.gouv.fr/rechercher-une-donnee/dataset/IGNF_BD-ORTHO">Photographies aériennes IGN</a> &copy; IGN &mdash; <a href="https://ia.numerique.gouv.fr/licence-ouverte-open-licence/">Licence Ouverte Etalab 2.0</a>'
				}).addTo(map),
			}, {
				// Offline terrain tiles built from IGN's RGE ALTI WMTS (Float32 BIL).
				'IGN Terrain (3D)': new L.TerrainLayer({
					source: 'data/paris-terrain.pmtiles',
					center: [48.8582601, 2.29449985],
					ariaLabel: 'IGN terrain with 3D map layers',
					attribution: '<a href="https://cartes.gouv.fr/rechercher-une-donnee/dataset/IGNF_RGE-ALTI">RGE ALTI</a> &copy; IGN &mdash; <a href="https://ia.numerique.gouv.fr/licence-ouverte-open-licence/">Licence Ouverte Etalab 2.0</a>'
				}).addTo(map),
				// Offline archive built by `node build/pmtiles.js`.
				'Paris buildings (3D)': new L.Layer3D({
					attribution: '<a href="https://opendata.paris.fr/explore/dataset/volumesbatisparis/">Building volumes: Ville de Paris</a> (<a href="https://opendatacommons.org/licenses/odbl/">ODbL</a>)',
					source: 'data/paris-buildings.pmtiles',
					roofTexture: true,
					ariaLabel: '3D view of the Eiffel Tower and Paris buildings',
					featureStyle({ properties: { h_et_max: storeys, nb_pl: floors, b_rdc: ground } }) {
						if (!Number.isFinite(storeys) || storeys < 0 || ![0, 1].includes(ground) ||
							(ground === 0 && (!Number.isFinite(floors) || floors <= 0 || floors > storeys + 1))) return null;
						// approximate height at 3 m/storey
						const top = (storeys + 1) * 3;
						return {
							top,
							bottom: ground === 0 ? Math.max(0, top - floors * 3) : 0,
							color: { h: 0.09 - Math.min(storeys / 40, 1) * 0.055, s: 0.48,
								l: 0.76 - Math.min(storeys / 40, 1) * 0.28 }
						};
					},
					tooltipContent({ properties: { h_et_max: storeys, nb_pl: floors, b_rdc: ground } }) {
						const content = document.createElement('div');
						content.innerHTML = `<b>Building</b><br>Estimated height: ${(storeys + 1) * 3} m · ${storeys} storeys${Number.isFinite(floors) ? ` · ${floors} ground floors` : ''}${ground === 0 ? ' · elevated ground floor' : ''}`;
						return content;
					}
				}).addTo(map),
				// OSM way 5013364 links to 3dmr=4; revision 3 is a CC0, metre-scale GLB.
				'Paris trees (3D)': new L.Layer3D({
					source: 'data/paris-trees.pmtiles',
					attribution: '<a href="https://opendata.paris.fr/explore/dataset/les-arbres/">Trees: Ville de Paris</a> (<a href="https://opendatacommons.org/licenses/odbl/">ODbL</a>)',
					featureStyle({ properties: p }) {
						if (p.typeemplacement !== 'Arbre') return null;
						const estimatedHeight = ({ Jeune: 4, 'Jeune (arbre)': 4, 'Jeune (arbre)Adulte': 8,
							'Jeune (arbre) adulte': 8, Adulte: 15, Mature: 20 })[p.stadedeveloppement] || 10;
						const top = p.hauteurenm > 0 && p.hauteurenm <= 60 ? p.hauteurenm : estimatedHeight;
						const trunkRadius = p.circonferenceencm > 0 && p.circonferenceencm <= 2500
							? p.circonferenceencm / (200 * Math.PI) : top / 80;
						const conifer = /^(Abies|Picea|Cedrus|Cupressus|Taxus|Sequoia|Sequoiadendron|Thuja)$/.test(p.genre);
						const palm = /^(Phoenix|Trachycarpus|Chamaerops|Washingtonia)$/.test(p.genre);
						return {
							top, trunkRadius,
							crownBottom: top * (palm ? 0.75 : conifer ? 0.2 : 0.35),
							crownRadius: Math.max(trunkRadius, top * (conifer ? 0.18 : palm ? 0.22 : 0.28)),
							crownShape: conifer ? 'cone' : 'round',
							color: conifer ? 0x315e45 : palm ? 0x688d42 : 0x55863d,
						};
					},
					tooltipContent({ properties: p }) {
						const content = document.createElement('div');
						content.style.whiteSpace = 'pre-line';
						content.textContent = [
							p.libellefrancais || p.genre || 'Tree',
							[p.genre, p.espece].filter(Boolean).join(' '),
							`Height: ${p.hauteurenm > 0 && p.hauteurenm <= 60 ? `${p.hauteurenm} m (recorded)` : 'estimated from development stage'}`,
							`Trunk circumference: ${p.circonferenceencm > 0 && p.circonferenceencm <= 2500 ? `${p.circonferenceencm} cm (recorded)` : 'estimated from height'}`,
							p.stadedeveloppement,
							p.remarquable === 'OUI' ? 'Remarkable tree' : '',
							'Schematic crown (not surveyed)',
						].filter(Boolean).join('\n');
						return content;
					},
				}).addTo(map),
				// OSM way 5013364 links to 3dmr=4; revision 3 is a CC0, metre-scale GLB.
				// Register the four ground corners to OSM pillars 69034127/135/179/180.
				// The GLB is axis-aligned, not north-aligned; its horizontal footprint is slightly undersized.
				'Eiffel Tower (3D)': new L.Layer3D({
					center: [48.8582601, 2.29449985],
					model: '../misc/eiffel-tower.glb',
					tooltipContent() {
						const content = document.createElement('div');
						content.innerHTML = '<div><b>Eiffel Tower</b><br>Height: 330 m including antennas (300 m structure)<br>Opened: 1889, for the World Exhibition<br>Designer: Gustave Eiffel and his engineering team<br>Location: Champ de Mars, Paris</div>';
						return content;
					},
					rotation: [0, 45.81 * Math.PI / 180, 0],
					scale: [1.0257, 1, 1.0167],
					attribution: '<a href="https://3dmr.eu/model/4">CC0 model: n42k / Blend Swap</a>',
				}).addTo(map),
			
			}, { collapsed: false }).addTo(map);
		</script>
	</body>
</html>
